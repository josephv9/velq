name: Velq prelaunch checks

on:
  push:
    branches: [main, site]
    paths:
      - 'velq-site.php'
      - 'image-patch.php'
      - 'authority-extension.php'
      - 'discovery-extension.php'
      - 'assets/discovery/**'
      - 'scripts/build-discovery-guides.py'
      - 'scripts/test-discovery.cjs'
      - 'scripts/submit-indexnow.py'
      - 'media/**'
      - 'assets/velq-media*'
      - 'assets/velq-authority-links.css'
      - 'scripts/test-authority-resources.cjs'
      - 'research-content.php'
      - 'research-extension.php'
      - 'research/**'
      - 'assets/research/**'
      - 'tools/serving-comparison-calculator/**'
      - 'tools/nutrition-label-value-calculator/**'
      - 'blog/protein-gummies-with-fiber-comparison/index.html'
      - 'scripts/build-research-pages.py'
      - 'scripts/test-research-*.cjs'
      - 'velq-analytics.js'
      - 'scripts/test-ga4-loader.cjs'
      - 'scripts/test-responsive-velq-images.cjs'
      - 'assets/velq-strawberry-gummies-hero-20261015-v3-*.webp'
      - 'assets/velq-gummies-packshot-20261015-v2-*.webp'
      - 'scripts/test-gummy-seo.cjs'
      - 'scripts/test-commercial-seo.cjs'
      - 'assets/velq-commercial-m2.css'
      - 'scripts/validate-velq-site.cjs'
      - 'scripts/test-waitlist-attribution.cjs'
      - '.github/workflows/velq-prelaunch-checks.yml'
  pull_request:
    branches: [main, site]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        run: php -l velq-site.php
      - name: Validate SEO response filter PHP syntax
        run: php -l image-patch.php
      - name: Validate research routes and response extension
        run: |
          php -l research-content.php
          php -l research-extension.php
          php -l authority-extension.php
          php -l discovery-extension.php
      - name: Verify image discovery, structured metadata and unchanged crawl controls
        run: node scripts/test-discovery.cjs
      - name: Check the explicit IndexNow submission utility
        run: python3 -m py_compile scripts/submit-indexnow.py
      - name: Verify media discovery and preserve unrelated responses
        run: node scripts/test-authority-resources.cjs
      - name: Verify dated research tables and downloads reproduce exactly
        run: |
          python3 scripts/build-research-pages.py
          git diff --exit-code -- research/ assets/research/gummy-labels-2026-10-20.csv assets/research/gummy-serving-comparison-2026.svg
      - name: Check serving arithmetic and calculation completion semantics
        run: node scripts/test-research-calculators.cjs
      - name: Verify research routing, sitemaps, sources of attribution and API integrity
        run: node scripts/test-research-integration.cjs
      - name: Validate the packed Velq site and signup code
        run: node scripts/validate-velq-site.cjs
      - name: Test gummy buyer paths and page metadata without external requests
        run: node scripts/test-gummy-seo.cjs
      - name: Verify commercial buyer comparison journeys without external calls
        run: node scripts/test-commercial-seo.cjs
      - name: Test confirmed waitlist attribution without creating leads
        run: node scripts/test-waitlist-attribution.cjs
      - name: Verify one GA4 initializer and preserved event configuration
        run: node scripts/test-ga4-loader.cjs
      - name: Verify responsive WebP variants and rendered image markup
        run: node scripts/test-responsive-velq-images.cjs
