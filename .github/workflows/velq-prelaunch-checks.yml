name: Velq prelaunch checks

on:
  push:
    branches: [main, site]
    paths:
      - 'velq-site.php'
      - 'image-patch.php'
      - 'velq-analytics.js'
      - 'scripts/test-ga4-loader.cjs'
      - 'scripts/test-responsive-velq-images.cjs'
      - 'assets/velq-strawberry-gummies-hero-20261015-v3-*.webp'
      - 'assets/velq-gummies-packshot-20261015-v2-*.webp'
      - 'scripts/test-gummy-seo.cjs'
      - 'scripts/test-commercial-seo.cjs'
      - 'assets/velq-commercial-m2.css'
      - 'scripts/validate-velq-site.cjs'
      - 'scripts/test-waitlist-attribution.cjs'
      - '.github/workflows/velq-prelaunch-checks.yml'
  pull_request:
    branches: [main, site]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        run: php -l velq-site.php
      - name: Validate SEO response filter PHP syntax
        run: php -l image-patch.php
      - name: Validate the packed Velq site and signup code
        run: node scripts/validate-velq-site.cjs
      - name: Test gummy buyer paths and page metadata without external requests
        run: node scripts/test-gummy-seo.cjs
      - name: Verify commercial buyer comparison journeys without external calls
        run: node scripts/test-commercial-seo.cjs
      - name: Test confirmed waitlist attribution without creating leads
        run: node scripts/test-waitlist-attribution.cjs
      - name: Verify one GA4 initializer and preserved event configuration
        run: node scripts/test-ga4-loader.cjs
      - name: Verify responsive WebP variants and rendered image markup
        run: node scripts/test-responsive-velq-images.cjs
