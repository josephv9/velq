name: Velq live sitemap and mobile performance audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/velq-live-seo-mobile-audit.yml'
      - 'image-patch.php'
      - '.htaccess'
      - 'seo-growth-extension.php'
      - 'discovery-extension.php'
      - 'research/gummy-serving-study-2026/index.html'
      - 'scripts/test-discovery.cjs'
      - 'guides/index.html'
      - 'wholesale/index.html'
      - 'blog/protein-gummies-with-fiber-comparison/index.html'
      - 'assets/velq-strawberry-gummies-hero-20261015-v3-*.webp'
      - 'assets/velq-gummies-packshot-20261015-v2-*.webp'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-live-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4

      - name: Verify public robots and sitemap URL responses
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, re, time, urllib.request, urllib.error, xml.etree.ElementTree as ET
          base='https://velqnutrition.com'
          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Velq-SEO-QA/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=25) as resp:
                  return resp.status,resp.geturl(),dict(resp.headers),resp.read(3_000_000).decode('utf-8','replace')
          def fetch_initial(url):
              # Deploy-time caches sometimes transiently return a 404 for the
              # dynamic sitemap. Retry briefly, but fail genuine persistent errors.
              for attempt in range(4):
                  try: return fetch(url)
                  except urllib.error.HTTPError as error:
                      if error.code not in (404,429,500,502,503,504) or attempt==3: raise
                      print('INITIAL_URL_RETRY',json.dumps({'url':url,'status':error.code,'attempt':attempt+1}))
                      time.sleep(1+attempt)
          status,final,headers,robots=fetch_initial(base+'/robots.txt')
          print('ROBOTS',json.dumps({'status':status,'url':final,'contains_sitemap':base+'/sitemap.xml' in robots,'length':len(robots)}))
          status,final,headers,xml=fetch_initial(base+'/sitemap.xml')
          print('SITEMAP',json.dumps({'status':status,'url':final,'content_type':headers.get('Content-Type'),'length':len(xml)}))
          root=ET.fromstring(xml)
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[el.text for el in root.findall('.//s:loc',ns)]
          assert len(urls)>=20, f'Only {len(urls)} sitemap URLs'
          assert len(urls)==len(set(urls)),'Duplicate sitemap URLs'
          assert all(u.startswith(base+'/') for u in urls),'Noncanonical host in sitemap'
          def check(url):
              errors=[]
              for attempt in range(1,4):
                  try:
                      status,final,headers,body=fetch(url)
                      meta_noindex=bool(re.search(r'<meta[^>]+name=["\x27]robots["\x27][^>]+noindex',body,re.I))
                      x_noindex='noindex' in headers.get('X-Robots-Tag','').lower()
                      has_canonical='rel="canonical"' in body or "rel='canonical'" in body
                      return {'url':url,'status':status,'final':final,'noindex':meta_noindex or x_noindex,'canonical_tag':has_canonical,'bytes':len(body),'retries':attempt-1,'transient_errors':errors}
                  except Exception as e:
                      errors.append(str(e))
                      if attempt<3: time.sleep(0.6*attempt)
              return {'url':url,'errors':errors}
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              checked=list(pool.map(check,urls))
          failures=[x for x in checked if x.get('status')!=200 or x.get('noindex') or x.get('final')!=x.get('url') or not x.get('canonical_tag')]
          print('SITEMAP_COVERAGE',json.dumps({'total_urls':len(urls),'200_ok':len(checked)-len([x for x in checked if x.get('status')!=200]),'recovered_transient_errors':[x for x in checked if x.get('retries',0)>0],'failures':failures},indent=2))
          assert not failures, f'{len(failures)} sitemap URLs have crawl or canonical issues'
          print('PASS: All sitemap URLs return indexable canonical pages from the preferred host. This is not a Google indexed-page count.')
          PY

      - name: Verify canonical guide aliases, commercial links and JSON-LD
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.request
          origin='https://velqnutrition.com'
          for alias in ['/guides/','/guides/index.html']:
              with urllib.request.urlopen(origin+alias,timeout=25) as resp:
                  assert resp.status==200 and resp.geturl()==origin+'/guides',f'{alias}: wrong canonical redirect'
          for path,expected_type in [('/guides','CollectionPage'),('/products/strawberry-protein-fiber-gummies','WebPage'),('/wholesale/','WebPage')]:
              with urllib.request.urlopen(origin+path,timeout=25) as resp:
                  assert resp.status==200 and resp.geturl()==origin+path,path
                  html=resp.read(3_000_000).decode('utf-8','replace')
              assert ('rel="canonical" href="'+origin+path+'"') in html,path+': wrong canonical'
              scripts=re.findall(r'<script\b[^>]*type=["\x27]application/ld\+json["\x27][^>]*>(.*?)</script>',html,re.I|re.S)
              parsed=[json.loads(text) for text in scripts]
              assert parsed,path+': JSON-LD missing'
              types=[]
              def walk(x):
                  if isinstance(x,dict):
                      if '@type' in x: types.extend(x['@type'] if isinstance(x['@type'],list) else [x['@type']])
                      for v in x.values(): walk(v)
                  elif isinstance(x,list):
                      for v in x: walk(v)
              for p in parsed: walk(p)
              assert expected_type in types,f'{path}: expected {expected_type}, got {types}'
              if path=='/guides':
                  assert '/products/strawberry-protein-fiber-gummies' in html and '/wholesale/' in html,'Guide commercial links missing'
              print('SCHEMA_AND_CANONICAL',json.dumps({'path':path,'types':types,'valid_jsonld_scripts':len(parsed)}))
          with urllib.request.urlopen(origin+'/blog/protein-gummies-with-fiber-comparison',timeout=25) as resp:
              html=resp.read(3_000_000).decode('utf-8','replace')
          assert '/products/strawberry-protein-fiber-gummies' in html and '/wholesale/' in html
          print('PASS: guide aliases, commercial links, canonical tags and structured data')
          PY

      - name: Verify live responsive image files and rendered homepage
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,time,re
          base='https://velqnutrition.com'
          names=['velq-strawberry-gummies-hero-20261015-v3','velq-gummies-packshot-20261015-v2']
          checks=[]
          for name in names:
              for width in [480,800,1200]:
                  relative=f'/assets/{name}-{width}.webp'
                  for attempt in range(3):
                      try:
                          req=urllib.request.Request(base+relative,headers={'Cache-Control':'no-cache','User-Agent':'Velq-image-deployment-QA/1.0'})
                          with urllib.request.urlopen(req,timeout=18) as res:
                              size=len(res.read(350000))
                              row={'asset':relative,'http':res.status,'content_type':res.headers.get('Content-Type'),'bytes':size,'attempt':attempt+1}
                              checks.append(row)
                              assert res.status==200 and 'image/webp' in row['content_type'] and size>10000,row
                              break
                      except Exception as exc:
                          if attempt==2: checks.append({'asset':relative,'error':str(exc)})
                          else: time.sleep(1)
          for row in checks: print('IMAGE',json.dumps(row))
          assert len(checks)==6 and all(x.get('http')==200 for x in checks),'Responsive image assets are not all live.'
          req=urllib.request.Request(base+'/',headers={'Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=25) as res: html=res.read(250000).decode('utf-8','replace')
          # The approved homepage hero now has mobile-width variants and matching
          # preload srcset. Previous responsive assets remain live for older layouts.
          current='/assets/velq-cover-cyan-stems-20261104.webp'
          for relative in ['/assets/velq-cover-cyan-stems-20261104-480.webp',
                           '/assets/velq-cover-cyan-stems-20261104-800.webp',
                           '/assets/velq-gym-small-packet-20261104-480.webp',
                           '/assets/velq-gym-small-packet-20261104-800.webp']:
              req=urllib.request.Request(base+relative,headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=25) as response:
                  content_type=response.headers.get('Content-Type','')
                  size=len(response.read(200000))
                  assert response.status==200 and 'image/webp' in content_type and size>10000,(relative,response.status,content_type,size)
                  print('RESPONSIVE_ASSET',json.dumps({'asset':relative,'bytes':size,'status':response.status}))
          with urllib.request.urlopen(base+current,timeout=25) as hero_response:
              hero_status=hero_response.status
              hero_type=hero_response.headers.get('Content-Type','')
              hero_body=hero_response.read(350000)
          assert hero_status==200 and 'image/webp' in hero_type and len(hero_body)>10000
          hero_tag=re.search(r'<img[^>]*class="approved-cover-art"[^>]*>',html)
          preload_tag=re.search(r'<link[^>]*data-velq-responsive-preload[^>]*>',html)
          print('SERVER_HERO_TAG',(hero_tag.group(0) if hero_tag else 'NOT_FOUND')[:1200])
          print('SERVER_PRELOAD_TAG',(preload_tag.group(0) if preload_tag else 'NOT_FOUND')[:1200])
          content={'has_current_hero':current in html,
                   'has_priority':bool(re.search(r'<img[^>]*class="approved-cover-art"[^>]*fetchpriority="high"',html)),
                   'has_mobile_srcset':bool(re.search(r'<img[^>]*class="approved-cover-art"[^>]*srcset="[^"]*velq-cover-cyan-stems-20261104-480\.webp 480w',html)),
                   'preload_matches_responsive_hero':bool(re.search(r'<link[^>]*data-velq-responsive-preload[^>]*href="/assets/velq-cover-cyan-stems-20261104-800\.webp"[^>]*imagesrcset="[^"]*velq-cover-cyan-stems-20261104-480\.webp 480w',html))}
          print('HOMEPAGE_IMAGE_MARKUP',json.dumps(content))
          assert all(content.values()),'Rendered homepage hero or responsive preload is missing.'
          PY

      - name: Install Lighthouse
        if: always()
        run: npm install --global lighthouse@12

      - name: Mobile Lighthouse homepage
        if: always()
        continue-on-error: true
        run: |
          lighthouse 'https://velqnutrition.com/' --chrome-flags='--headless=new --no-sandbox --disable-dev-shm-usage' --only-categories=performance,accessibility,seo --form-factor=mobile --screenEmulation.mobile=true --output=json --output-path="/tmp/velq-home-mobile.json" --quiet
          node -e 'const r=require("/tmp/velq-home-mobile.json");const a=r.audits;console.log(JSON.stringify({url:r.finalUrl,device:"mobile",scores:Object.fromEntries(Object.entries(r.categories).map(([k,v])=>[k,Math.round(v.score*100)])),labLCP:a["largest-contentful-paint"]?.displayValue,labCLS:a["cumulative-layout-shift"]?.displayValue,labTBT:a["total-blocking-time"]?.displayValue,labFCP:a["first-contentful-paint"]?.displayValue,ga4NetworkIDs:[...new Set((a["network-requests"]?.details?.items||[]).flatMap(x=>(x.url||"").match(/G-[A-Z0-9]{8,}/g)||[]))]},null,2));'

      - name: Mobile Lighthouse protein gummies comparison
        if: always()
        continue-on-error: true
        run: |
          lighthouse 'https://velqnutrition.com/blog/protein-gummies-with-fiber-comparison' --chrome-flags='--headless=new --no-sandbox --disable-dev-shm-usage' --only-categories=performance,accessibility,seo --form-factor=mobile --screenEmulation.mobile=true --output=json --output-path="/tmp/velq-comparison-mobile.json" --quiet
          node -e 'const r=require("/tmp/velq-comparison-mobile.json");const a=r.audits;console.log(JSON.stringify({url:r.finalUrl,device:"mobile",scores:Object.fromEntries(Object.entries(r.categories).map(([k,v])=>[k,Math.round(v.score*100)])),labLCP:a["largest-contentful-paint"]?.displayValue,labCLS:a["cumulative-layout-shift"]?.displayValue,labTBT:a["total-blocking-time"]?.displayValue,labFCP:a["first-contentful-paint"]?.displayValue,ga4NetworkIDs:[...new Set((a["network-requests"]?.details?.items||[]).flatMap(x=>(x.url||"").match(/G-[A-Z0-9]{8,}/g)||[]))]},null,2));'

      - name: Field Core Web Vitals if PageSpeed API permits
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request
          url='https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=https%3A%2F%2Fvelqnutrition.com%2F&strategy=mobile'
          try:
              with urllib.request.urlopen(url,timeout=90) as resp: data=json.load(resp)
              field=data.get('loadingExperience',{}).get('metrics',{})
              origin=data.get('originLoadingExperience',{}).get('metrics',{})
              print('CHROME_USER_EXPERIENCE',json.dumps({'url_level':field,'origin_level':origin},indent=2)[:6000])
              if not field and not origin: print('No CrUX field data for this origin; lab Lighthouse is not a substitute for field INP.')
          except Exception as e:
              print('Public PageSpeed field-data lookup unavailable:',str(e))
          PY

      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velq-mobile-lighthouse
          path: |
            /tmp/velq-home-mobile.json
            /tmp/velq-comparison-mobile.json
          if-no-files-found: warn
