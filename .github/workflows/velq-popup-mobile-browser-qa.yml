name: Velq Popup Mobile Browser QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/velq-popup-mobile-browser-qa.yml'
      - 'scripts/qa-velq-popup-mobile.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: site
          path: site-live
      - name: Install Playwright Chromium
        working-directory: main
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run mobile and desktop popup QA with mocked waitlist
        working-directory: main
        run: node scripts/qa-velq-popup-mobile.cjs
