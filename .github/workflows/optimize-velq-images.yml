name: Optimize Velq product images

on:
  push:
    branches: [main]
    paths:
      - 'scripts/optimize-velq-images.py'
      - '.github/workflows/optimize-velq-images.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: velq-image-optimization
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - name: Generate, verify, and record responsive WebP files
        run: python scripts/optimize-velq-images.py
      - name: Commit optimized derivatives back to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/velq-strawberry-gummies-hero-20261015-v3-*.webp assets/velq-gummies-packshot-20261015-v2-*.webp
          if git diff --cached --quiet; then
            echo 'No new changes.'
            exit 0
          fi
          git commit -m 'perf: add optimized responsive WebP variants for Velq imagery'
          git push origin HEAD:main
