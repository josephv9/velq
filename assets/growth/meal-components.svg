<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">A repeatable meal structure</title><desc id="desc">Four meal components: a protein food, a carbohydrate food, fruit or vegetables, and a fat-containing food. The diagram is a checklist, not a portion ratio.</desc><rect width="900" height="600" fill="#fff9e9"/><text x="55" y="70" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#20251f">Build a meal you can repeat.</text><g font-family="Arial,sans-serif" fill="#20251f"><rect x="55" y="110" width="375" height="170" rx="22" fill="#f8cdd2"/><text x="80" y="160" font-size="28" font-weight="700">Protein food</text><text x="80" y="205" font-size="21">Eggs, yogurt, chicken, fish,</text><text x="80" y="239" font-size="21">tofu, tempeh, or beans</text><rect x="470" y="110" width="375" height="170" rx="22" fill="#ffe9a2"/><text x="495" y="160" font-size="28" font-weight="700">Carbohydrate food</text><text x="495" y="205" font-size="21">Oats, rice, potatoes,</text><text x="495" y="239" font-size="21">bread, or pasta</text><rect x="55" y="310" width="375" height="170" rx="22" fill="#dcebd6"/><text x="80" y="360" font-size="28" font-weight="700">Fruit or vegetables</text><text x="80" y="405" font-size="21">Choose a familiar side</text><text x="80" y="439" font-size="21">you enjoy and tolerate</text><rect x="470" y="310" width="375" height="170" rx="22" fill="#e0e8fa"/><text x="495" y="360" font-size="28" font-weight="700">Fat-containing food</text><text x="495" y="405" font-size="21">Olive oil, nuts, seeds,</text><text x="495" y="439" font-size="21">avocado, or nut butter</text><text x="55" y="535" font-size="21">A component checklist, not a portion ratio or personal prescription.</text></g></svg>