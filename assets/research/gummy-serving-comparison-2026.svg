<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Fiber per labeled serving and per gummy</title><desc id="desc">Four selected fiber gummy products, based on manufacturer information checked 20 October 2026. Values are label arithmetic, not an efficacy ranking.</desc><rect width="1200" height="675" fill="#fffcec"/><g font-family="Arial,sans-serif" fill="#23372b"><text x="48" y="56" font-size="16" font-weight="bold" letter-spacing="2">VELQ RESEARCH · OCTOBER 2026</text><text x="48" y="104" font-size="36" font-weight="bold">A serving is not always one gummy.</text><text x="48" y="137" font-size="18">Four selected fiber gummy products · exact serving basis shown in the study</text><text x="50" y="192" font-size="23" font-weight="bold">Fiber per labeled serving</text><text x="50" y="226" font-size="17">Metamucil <tspan fill="#5e685e" font-size="14">(3 gummies)</tspan></text><rect x="50" y="238" width="268.75" height="23" fill="#ae3830" rx="3"/><text x="328.75" y="256" font-size="17" font-weight="bold">5 g</text><text x="50" y="308" font-size="17">Benefiber <tspan fill="#5e685e" font-size="14">(3 gummies)</tspan></text><rect x="50" y="320" width="322.50" height="23" fill="#ae3830" rx="3"/><text x="382.50" y="338" font-size="17" font-weight="bold">6 g</text><text x="50" y="390" font-size="17">vitafusion <tspan fill="#5e685e" font-size="14">(3 gummies)</tspan></text><rect x="50" y="402" width="403.12" height="23" fill="#ae3830" rx="3"/><text x="463.12" y="420" font-size="17" font-weight="bold">7.5 g</text><text x="50" y="472" font-size="17">OLLY <tspan fill="#5e685e" font-size="14">(2 gummies)</tspan></text><rect x="50" y="484" width="268.75" height="23" fill="#ae3830" rx="3"/><text x="328.75" y="502" font-size="17" font-weight="bold">5 g</text><text x="640" y="192" font-size="23" font-weight="bold">Fiber per gummy</text><text x="640" y="226" font-size="17">Metamucil <tspan fill="#5e685e" font-size="14">(3 gummies)</tspan></text><rect x="640" y="238" width="238.89" height="23" fill="#295b46" rx="3"/><text x="888.89" y="256" font-size="17" font-weight="bold">1.67 g</text><text x="640" y="308" font-size="17">Benefiber <tspan fill="#5e685e" font-size="14">(3 gummies)</tspan></text><rect x="640" y="320" width="286.67" height="23" fill="#295b46" rx="3"/><text x="936.67" y="338" font-size="17" font-weight="bold">2 g</text><text x="640" y="390" font-size="17">vitafusion <tspan fill="#5e685e" font-size="14">(3 gummies)</tspan></text><rect x="640" y="402" width="358.33" height="23" fill="#295b46" rx="3"/><text x="1008.33" y="420" font-size="17" font-weight="bold">2.5 g</text><text x="640" y="472" font-size="17">OLLY <tspan fill="#5e685e" font-size="14">(2 gummies)</tspan></text><rect x="640" y="484" width="358.33" height="23" fill="#295b46" rx="3"/><text x="1008.33" y="502" font-size="17" font-weight="bold">2.5 g</text><text x="48" y="600" font-size="16">Source: manufacturer label panels and product pages · observed 20 October 2026 (UTC).</text><text x="48" y="629" font-size="15" fill="#5e685e">Selected sample, not a market average. Per-gummy figures are arithmetic, not suggested doses.</text></g></svg>